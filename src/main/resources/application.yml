spring:
  application:
    name: interviewai
  datasource:
    url: jdbc:postgresql://localhost:5432/interviewai
    username: interviewai
    password: interviewai
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
      completion-mode: update
      staleness:
        published: 30s
        processing: 30s
        resubmitted: 30s
        check-interval: 10s

interviewai:
  llm:
    ollama:
      base-url: http://127.0.0.1:11434
      model-name: llama3.2:3b
      embedding-model-name: nomic-embed-text:latest
      timeout: 60s
  storage:
    s3:
      endpoint: http://localhost:4566
      region: eu-central-1
      bucket: interviewai-cv
      access-key: test
      secret-key: test
      path-style-access: true
  messaging:
    sqs:
      endpoint: http://localhost:4566
      region: eu-central-1
      access-key: test
      secret-key: test
      queue-name: interview-completed
      dlq-name: interview-completed-dlq
      long-poll-duration: 20s
      visibility-timeout: 2m
      max-receive-count: 5
      outbox-retry-interval: 10s
      outbox-resubmission-batch-size: 50
  report:
    llm:
      base-url: http://127.0.0.1:11434
      model-name: llama3.2:3b
      timeout: 60s
    generation:
      max-attempts: 3
  streaming:
    emitter-timeout: 5m
    poll-interval: 50ms
    heartbeat-interval: 15s

management:
  endpoints:
    web:
      exposure:
        include: health,info
